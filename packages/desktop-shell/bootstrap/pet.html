<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' asset: http://asset.localhost; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenWork Pet</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body {
        cursor: grab;
      }
      .pet {
        width: 144px;
        height: 156px;
        background: url('./qwen-pet.webp') 0 0 / 1152px 1404px no-repeat;
        animation: idle 1.1s steps(1) infinite;
        image-rendering: pixelated;
        filter: drop-shadow(0 9px 8px rgb(0 0 0 / 35%));
      }
      @keyframes idle {
        0% {
          background-position: 0 0;
        }
        12.5% {
          background-position: -144px 0;
        }
        25% {
          background-position: -288px 0;
        }
        37.5% {
          background-position: -432px 0;
        }
        50% {
          background-position: -576px 0;
        }
        62.5% {
          background-position: -720px 0;
        }
        75% {
          background-position: -864px 0;
        }
        87.5% {
          background-position: -1008px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pet {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div class="pet" data-tauri-drag-region aria-label="Qwen desktop pet"></div>
    <script src="./pet.js"></script>
  </body>
</html>
