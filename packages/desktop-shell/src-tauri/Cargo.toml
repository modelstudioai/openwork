[package]
name = "openwork-desktop"
version = "0.1.0"
description = "OpenWork desktop shell — Tauri"
authors = ["Model Studio AI"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22.1"
command-group = "5.0.1"
dunce = "1.0.5"
network-interface = "2.0.5"
open = "5.4.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.8.5", features = ["macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-updater = "2"
ureq = { version = "3.1.2", default-features = false }
url = "2.5.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
